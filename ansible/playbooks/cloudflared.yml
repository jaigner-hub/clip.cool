---
# cloudflared connectors — runs on BOTH boxes.
#
# Since 2026-07-30 there is NO Load Balancer. Both boxes register a connector to the SAME app tunnel
# (`vent-keygrip2`), which is what makes clip.cool + id.clip.cool highly available: Cloudflare spreads
# traffic across whichever connectors are registered, and stopping one is a clean drain (roles/drain).
# vent.dog additionally runs the chat tunnel's connector (`vent-keygrip` -> chat/livekit.vent.dog),
# because Dendrite and LiveKit are single-active there and a tunnel's ingress is shared by all of its
# connectors. See roles/cloudflared/defaults/main.yml for the full reasoning.
#
# ⚠️ Deploying this to vent.dog RECREATES its `cloudflared` container onto the app tunnel's token. If
# the chat connector is not up yet, the chat tunnel briefly has no connector at all — bring
# `cloudflared-chat` up first (or accept a few seconds of chat downtime).
#   ./ac ansible-playbook playbooks/cloudflared.yml
- name: cloudflared connectors (both app nodes)
  hosts: dev
  become: true
  roles:
    - cloudflared
