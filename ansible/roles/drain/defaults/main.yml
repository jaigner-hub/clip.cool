---
drain_dir: /opt/keygrip/drain
# Per-host identity: the Patroni member name for THIS box and its peer. `other_host` is the peer's
# INVENTORY name, which is not the same string as its Patroni member name — drain.env needs it to look
# up the peer's public_ip via hostvars.
drain_host_identity:
  vent.dog:  { mine: "vent-keygrip",  other: "vent-keygrip2", other_host: "vent.dog2" }
  vent.dog2: { mine: "vent-keygrip2", other: "vent-keygrip",  other_host: "vent.dog" }

# The tunnel whose connectors ARE the origins for clip.cool + id.clip.cool. Draining stops the LOCAL
# connector; the Cloudflare API below is only used to OBSERVE that (did mine deregister, does the peer
# still have connections), so a missing or dead token degrades the checks and never the drain itself.
#
# ⚠️ This is `vent-keygrip2` — the tunnel with a connector on BOTH boxes, despite the "2". The
# similarly-named `vent-keygrip` is the vent.dog-only CHAT tunnel and must NOT be drained: chat has no
# second connector, so stopping it takes chat down rather than moving it. See roles/cloudflared.
#
# Until 2026-07-30 this role drove a Cloudflare LOAD BALANCER pool instead, and that LB is now retired.
# The drift is what broke every reboot gate on this tier: the pool API returned 401 (the account token
# had been rotated outside the repo), so `drain.sh check` failed, rolling-deploy.sh aborted before
# deploying anything, and — because reboot_safe() calls the same check — the guarded auto-reboot timer
# refused every window, so kernel updates never landed. Ported from keygrip's #161.
drain_cf_account_id: "713923b79dee34635d5a5a1d8da34fbc"
drain_cf_tunnel_name: "vent-keygrip2"
# ⚠️ This is the shared ACCOUNT token — it can edit DNS and delete load balancers in every zone,
# including the AMS sites. drain.sh only reads Account -> Cloudflare Tunnel; a read-only token
# belongs here instead. Open follow-up, see the note in drain.env.j2.
drain_cf_token: "{{ vault_cloudflare_api_token | default('') }}"
# How long to let cloudflared finish in-flight requests after SIGTERM. Must exceed its own 30s
# --grace-period, and the compose stop_grace_period (45s) must exceed this.
drain_connector_stop_timeout: 40
# Fallback settle time when there is no API token to confirm deregistration with.
drain_connector_settle: 15
# The connector stack drain.sh stops. The SERVICE name matters: `cloudflared` is the app tunnel's
# connector; `cloudflared-chat` (vent.dog only) is deliberately left alone.
drain_cloudflared_compose: "{{ cloudflared_dir | default('/opt/keygrip/cloudflared') }}/compose.yml"

# The HA-Postgres stack drain.sh talks to. Both MUST track roles/postgres_ha — same cluster. Sourced
# from drain.env rather than hardcoded in drain.sh so a tier that moves the etcd port off 2379 doesn't
# make etcd_all_healthy() report 0/0 and refuse every reboot.
drain_pgha_compose: "{{ pg_ha_dir | default('/opt/keygrip-pgha') }}/compose.yml"
drain_etcd_client_port: "{{ etcd_client_port | default(2379) }}"

# The nightly pg_dump's advisory lock (roles/postgres_ha pg_ha_backup_lock). The reboot path hands off
# the Patroni leader, which severs an in-flight dump; `rclone rcat` then finalises the truncated stream
# into an object that passes every size check backup.sh makes. So the reboot gates skip their window
# while this is held. Follows the postgres_ha default when that role's vars are in scope, with a literal
# fallback for a play that installs drain without it.
drain_backup_lock: "{{ pg_ha_backup_lock | default('/run/lock/keygrip-pgha-backup.lock') }}"

# The local readiness probe `undrain` gates on before it re-registers this box's connector.
drain_readyz_host: "clip.cool"
drain_readyz_url: "http://127.0.0.1:8000/readyz"

# --- Unattended security updates + graceful auto-reboot on kernel updates ---
drain_auto_updates: true
# STAGGER the reboot windows so the two boxes never auto-reboot together (each checks the other's
# health before draining itself, but staggering guarantees only one is ever down). Per-host override in
# inventory; default below.
drain_reboot_time: "04:00"
