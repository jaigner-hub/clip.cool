---
# Cloudflare resources for the vent-keygrip tunnel — declarative, applied via the API
# (token: vault_cloudflare_api_token in SOPS). IDs below are not secret.
cf_api: "https://api.cloudflare.com/client/v4"
cf_account_id: "713923b79dee34635d5a5a1d8da34fbc"
# Zone + tunnel IDs are RESOLVED AT RUNTIME from these names (tasks/main.yml), not hardcoded.
# Rationale (learned the hard way): a deleted-and-re-added zone gets a BRAND-NEW zone id, and a
# recreated tunnel a new tunnel id. Hardcoding them meant the DNS tasks silently wrote to a dead
# zone after vent.dog was removed + re-added. Looking them up by name makes the role self-heal.
cf_zone_name: "vent.dog"
# ⚠️ `vent-keygrip` is the CHAT tunnel — vent.dog ONLY, one connector. Despite the name, it is NOT the
# tunnel the app rides; that is `vent-keygrip2` (cf_app_tunnel_name below), which runs a connector on
# BOTH boxes. The names are historical and deliberately not renamed — see roles/cloudflared/defaults.
cf_tunnel_name: "vent-keygrip"

# CHAT tunnel ingress — the catch-all (http_status:404) is appended automatically.
# Vent chat is single-active on vent.dog (Dendrite/LiveKit can't run two nodes yet). That is exactly
# why it needs its OWN tunnel: a remotely-managed tunnel shares one ingress config across every
# connector, so putting these hostnames on the two-connector app tunnel would send half their traffic
# to vent.dog2, which runs neither service. vent-web serves the SPA and reverse-proxies
# /api,/_matrix,/health to vent-server; auth is at Keycloak so it's public.
cf_ingress:
  - hostname: "chat.vent.dog"
    service: "http://vent-web:80"
  # LiveKit signaling (wss). Media is direct UDP to the box's public IP (ufw-opened); only the
  # HTTP/WS signaling rides the tunnel.
  - hostname: "livekit.vent.dog"
    service: "http://host.docker.internal:7880"

# Hostnames that get a proxied CNAME -> the tunnel. clip.cool + id.clip.cool are Load Balancers
# (apex block, clip.cool zone); chat/livekit are single-box CNAMEs to the vent.dog tunnel (Vent is
# single-active).
cf_dns_hostnames:
  - "chat.vent.dog"
  - "livekit.vent.dog"

# --- HSTS (Strict-Transport-Security) — owned at the EDGE (ADR 0004: TLS terminates at Cloudflare) ---
# Cloudflare emits the HSTS header for every *.vent.dog surface; the origins (app + static _headers)
# deliberately don't. RAMP CAREFULLY:
#   1. ship enabled + a SHORT max_age (300s) and confirm nothing on *.vent.dog breaks over HTTPS,
#   2. raise max_age toward 31536000 (1 yr),
#   3. flip include_subdomains only once EVERY *.vent.dog host is HTTPS-only,
#   4. set preload LAST, at public launch — it's effectively irreversible (browsers hard-pin it,
#      and removal means serving max-age=0 and waiting out every cached client + the preload list).
# nosniff stays false here: X-Content-Type-Options is owned by the origins (Django SECURE_CONTENT_TYPE_NOSNIFF
# + the marketing/portal _headers), so we don't double-manage it at the edge.
# ⚠️ Needs the API token to carry "Zone → Zone Settings → Edit" (a 403 here means that scope is missing).
cf_manage_hsts: true
cf_hsts:
  enabled: true
  max_age: 300                # start at 5 min; ramp UP once verified
  include_subdomains: false   # turn on only after every *.vent.dog host is HTTPS-only
  preload: false              # set LAST, at public launch — effectively irreversible
  nosniff: false              # nosniff is owned by the origins, not the edge

# --- The APP tunnel: clip.cool + id.clip.cool across BOTH boxes, with NO Load Balancer ---
# Retired the Cloudflare Load Balancer on 2026-07-30. It was a paid add-on doing a job that ONE
# multi-connector tunnel does for free: `vent-keygrip2` now runs a connector on each box, both serving
# this same ingress against their OWN local services, so Cloudflare spreads traffic across whichever
# connectors are registered and stopping one is a clean drain (roles/drain). Before, each box had its
# own tunnel and an LB fanned traffic across the two as pool origins.
#
# What that trade actually costs, so nobody re-discovers it as a surprise: the LB had a MONITOR probing
# /readyz, which pulled a box whose app was broken even though its connector was healthy. Connector
# registration can't see that — a box serving 502s keeps its share of traffic. Partial mitigation lives
# in roles/drain (`undrain` refuses to register a connector whose local /readyz isn't 200).
#
# ⚠️ The Load Balancing SUBSCRIPTION is still active and must stay: 14 other load balancers across 8
# zones on this account (amsfusion.com and the other AMS sites) run off the separate `ams-ionos` pool.
# Cancelling the add-on would take all of them down. Retiring these two LBs removes 2 LB hostnames and
# 2 origins from the bill, nothing more. Teardown is `bin/cf-retire-lb`, which asserts that separation
# object by object before it deletes anything.
cf_app_tunnel_name: "vent-keygrip2"      # ⚠️ the two-connector tunnel, despite the "2" in the name
cf_app_zone_name: "clip.cool"
# Ingress for the app tunnel. IDENTICAL on both connectors by definition (one tunnel, one config) —
# each resolves these service names against its own box: `webapp` on the shared keygrip-edge network,
# and host-networked Keycloak via host.docker.internal.
# Django /admin is PUBLIC (same-origin, staff via Keycloak SSO session). The break-glass *password*
# form is host-gated in the app itself (web.views.admin_login_gate via DJANGO_BREAK_GLASS_LOGIN_HOSTS)
# to the Tailscale Serve host only — ADR 0002 holds without a tunnel-level 404.
# /metrics is 404'd publicly (more-specific rule FIRST); Prometheus scrapes it over the edge net.
cf_app_ingress:
  - { hostname: "clip.cool", path: "^/metrics", service: "http_status:404" }
  - { hostname: "clip.cool", service: "http://webapp:8000" }
  - { hostname: "id.clip.cool", service: "http://host.docker.internal:8080" }   # host-networked Keycloak
# Proxied CNAMEs -> the app tunnel, in the clip.cool zone. These REPLACED the two load balancers.
# The apex works because Cloudflare flattens a proxied CNAME at the zone root.
cf_app_dns_hostnames:
  - "clip.cool"
  - "id.clip.cool"           # Keycloak issuer host

# --- Cloudflare Access (Zero Trust) ---
# Token now carries the "Access: Apps and Policies — Edit" scope, so this is ON.
#   ./ac ansible-playbook playbooks/cloudflare.yml
# NOTE: the role only *creates* missing apps/policies — it does not reconcile an existing app's
# emails (PUT-by-id). To change an allow-list, update via the API/dashboard AND edit here to match.
cf_manage_access: true

cf_access_apps:
  # Marketing site (apex) — GATED until launch; NOT public yet. The whole apex + the raw Pages
  # URL sit behind Access (allow-list below). Relax/remove when the site goes public (ADR 0012).
  - name: "keygrip marketing (gated — not public yet)"
    domain: "vent.dog"
    type: "self_hosted"
    session_duration: "24h"
    policy_name: "Allowed"
    include:
      - email: { email: "jeff.aigner@gmail.com" }
      - email: { email: "brad@keygrip.ai" }
      - email: { email: "zach@keygrip.ai" }
  - name: "keygrip marketing pages.dev (gated)"
    domain: "keygrip-marketing.pages.dev"
    type: "self_hosted"
    session_duration: "24h"
    policy_name: "Allowed"
    include:
      - email: { email: "jeff.aigner@gmail.com" }
      - email: { email: "brad@keygrip.ai" }
      - email: { email: "zach@keygrip.ai" }
  # Admin portal (launchpad of tool links) — staff-only, gated end to end.
  - name: "keygrip admin portal (portal.vent.dog)"
    domain: "portal.vent.dog"
    type: "self_hosted"
    session_duration: "24h"
    policy_name: "Allowed"
    include:
      - email: { email: "jeff.aigner@gmail.com" }
      - email: { email: "brad@keygrip.ai" }
      - email: { email: "zach@keygrip.ai" }
  - name: "keygrip admin portal (keygrip-portal.pages.dev)"
    domain: "keygrip-portal.pages.dev"
    type: "self_hosted"
    session_duration: "24h"
    policy_name: "Allowed"
    include:
      - email: { email: "jeff.aigner@gmail.com" }
      - email: { email: "brad@keygrip.ai" }
      - email: { email: "zach@keygrip.ai" }
  # Keycloak admin console — on the issuer host id.clip.cool (id.vent.dog retired).
  - name: "id-clip"
    domain: "id.clip.cool/admin"
    type: "self_hosted"
    session_duration: "24h"
    policy_name: "Admins"
    include:
      - email: { email: "jeff.aigner@gmail.com" }
      - email: { email: "brad@keygrip.ai" }
      - email: { email: "zach@keygrip.ai" }
  # Django admin: PUBLIC on app.vent.dog (same-origin; staff authenticate via Keycloak SSO) since
  # 2026-06-12 — no Access app, no tunnel 404. ADR 0002 is enforced in the app instead: the
  # *password* (break-glass) login form is host-gated to the Tailscale Serve host (:8447) via
  # DJANGO_BREAK_GLASS_LOGIN_HOSTS (web.views.admin_login_gate). History: Access app retired
  # 2026-06-08 (deleted out-of-band; this role only creates, never deletes), tailnet-only
  # 2026-06-08 → 2026-06-12 (caused host/cookie churn for staff — the admin lived on a
  # different origin than the app).
