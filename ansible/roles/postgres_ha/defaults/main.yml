---
# Self-hosted HA Postgres for dev — Patroni + etcd across the vent.dog pair, with a vote-only
# NixOS witness ('monitor') over Tailscale. See ADR 0016. All services run as containers (ADR 0006).
#
# IMPORTANT (cross-box plane): etcd, Patroni and HAProxy must reach their peers on the OTHER box,
# so their containers use `network_mode: host` and address peers by **tailnet MagicDNS name**
# (vent-keygrip / vent-keygrip2 / monitor on tail1ec6c3.ts.net). Host networking also lets the
# witness (native etcd on NixOS) and these containers speak the same flat tailnet.

pg_ha_dir: /opt/keygrip-pgha

# --- Cluster membership (names MUST be stable + unique; addresses are TAILNET IPs) ---
# Addresses are tailnet IPs, NOT MagicDNS names: the boxes run accept-dns=false (ADR/role default),
# so MagicDNS names like 'vent-keygrip2' don't resolve. Tailnet IPs are stable per node.
# The two Postgres data nodes (Patroni). `name` is the Patroni/etcd member name.
pg_ha_data_nodes:
  - { name: "vent-keygrip", address: "100.106.141.112" }
  - { name: "vent-keygrip2", address: "100.110.200.36" }
# Maps each inventory host to its Patroni/etcd identity (resolved per-host in tasks/main.yml).
pg_ha_host_identity:
  vent.dog: { name: "vent-keygrip", address: "100.106.141.112" }
  vent.dog2: { name: "vent-keygrip2", address: "100.110.200.36" }
# All three etcd members = the two data nodes + the NixOS witness 'monitor' (100.109.229.12). The
# witness runs etcd NATIVELY (services.etcd in ~/Projects/nixos-config); it is NOT managed here —
# see files/monitor-etcd.nix.example. monitor must be tag:keygrip for the ACL to allow etcd traffic.
pg_ha_etcd_members:
  - { name: "vent-keygrip", address: "100.106.141.112" }
  - { name: "vent-keygrip2", address: "100.110.200.36" }
  - { name: "monitor", address: "100.109.229.12" }
pg_ha_etcd_token: "keygrip-pgha"          # initial-cluster-token; MUST match the witness's Nix module

# Per-host identity — set from inventory in tasks (a play-level default that each host overrides).
# patroni_name / node_address are resolved per-host in tasks/main.yml from the membership list.

# --- Pinned images ---
pg_ha_postgres_major: "16"
pg_ha_patroni_image: "keygrip-patroni:local"          # built locally from templates/Dockerfile.patroni.j2
etcd_image: "quay.io/coreos/etcd:v3.5.16"
haproxy_image: "haproxy:2.9-alpine"
pgbouncer_image: "edoburu/pgbouncer:v1.23.1-p2"

# --- etcd tuning (RELAXED for the WAN/Tailscale hop to the homelab witness; ADR 0016) ---
# Defaults assume a LAN; the witness is across a home link, so loosen to avoid election churn.
etcd_heartbeat_ms: 250
etcd_election_ms: 2500
etcd_client_port: 2379
etcd_peer_port: 2380

# --- etcd MVCC compaction (measured on this cluster 2026-07-29) ---
# Patroni refreshes the DCS leader key every loop_wait and NEVER compacts etcd, so without
# auto-compaction every revision since bootstrap is retained. Measured here: 8 keys holding
# 356 KB of live data inside a 1.07 GB backend file — 99.97% dead revisions — against the
# 2 GiB default quota. At the quota etcd raises NOSPACE and goes READ-ONLY, Patroni can no
# longer refresh the leader lock, and the cluster demotes: a full-DB outage (chat AND clip,
# they share this cluster) on a predictable date. Keep ~1h; Patroni needs only current state.
#
# The 2026-07-29 backlog was cleared by hand — `etcdctl compact <rev>` then `defrag` per
# member, followers first, leader last — taking all three from 1.07 GB to ~350 KB with no
# failover. Two things to know if you ever repeat it:
#   - compaction frees revisions but NOT disk; only defrag shrinks the file, per member.
#   - defrag duration tracks IN-USE bytes, not file size, and `compact` returns BEFORE the
#     background page-freeing finishes. Defragging too soon copies the not-yet-freed pages:
#     measured 19.6s that way vs 0.1s once the pages were actually free. With patroni_ttl
#     at 20 that difference is the difference between safe and a needless failover — wait
#     for dbSizeInUse to drop, and prove the duration on the witness before the leader.
# The NixOS witness needs these settings in its own config too — done 2026-07-29 in
# ~/Projects/nixos-config, vent-etcd-witness.nix — because only the LEADER runs the periodic
# compactor, and the witness can win an election. It is not that followers skip compacting: the
# leader's compaction is a raft proposal every member applies, verified 2026-07-30 (all three logged
# `finished scheduled compaction` at revision 3826161, hash 96283083, 21–28 ms). So an unconfigured
# witness is a latent gap that only opens while it holds leadership, not a permanent one.
#
# First periodic run verified 2026-07-30 02:51Z: dbSizeInUse held at 1.1 MB. Note the FILE is
# 1.7 MB and will not shrink without defrag — etcd reuses the freed pages, so it plateaus near the
# working-set high-water mark instead of growing without bound like it did before compaction. That
# plateau has only ~1h of evidence behind it; if the file keeps climbing, defrag per member
# (followers first) using the timing caveat above.
etcd_auto_compaction_mode: periodic
etcd_auto_compaction_retention: "1h"

# --- Patroni DCS / failover behaviour ---
patroni_ttl: 20
patroni_loop_wait: 3
patroni_retry_timeout: 5
patroni_maximum_lag_on_failover: 1048576      # 1 MiB; don't promote a too-far-behind replica
patroni_rest_port: 8008

# --- Postgres parameters (modest dev box; 7.7 GiB) ---
pg_ha_parameters:
  max_connections: "200"
  shared_buffers: "1GB"
  effective_cache_size: "3GB"
  work_mem: "16MB"
  maintenance_work_mem: "256MB"
  wal_level: "replica"
  hot_standby: "on"
  max_wal_senders: "10"
  max_replication_slots: "10"
  wal_keep_size: "512MB"

# --- App database/users (matches clip_web today: db 'clip', app user 'clip') ---
app_db_name: "clip"
app_db_user: "clip"

# --- Vent chat (chat.vent.dog): its own app DB + Dendrite's DB, created in the same cluster.
# Both connect via HAProxy's write port (5000) directly to the leader — NOT through PgBouncer —
# so PgBouncer/userlist stay clip-only. Passwords in SOPS (vault_vent_db_password / vault_dendrite_db_password).
vent_db_name: "vent"
vent_db_user: "vent"
dendrite_db_name: "dendrite"
dendrite_db_user: "dendrite"

# --- HAProxy endpoints the app uses (Postgres itself owns host :5432, so HAProxy uses 5000/5001) ---
# write/leader port (session) — the worker (LISTEN/NOTIFY) connects here; PgBouncer also points here.
pg_ha_haproxy_write_port: 5000
# read-only/replicas port (optional, for read traffic) — not used by the app yet.
pg_ha_haproxy_read_port: 5001
# Patroni REST stats UI / haproxy stats + Prometheus metrics (tailnet only; see haproxy.cfg.j2).
pg_ha_haproxy_stats_port: 7000
# Global connection ceiling. Hitting it makes HAProxy stop accept()ing while every health signal
# stays green — see the annotated `global` block in haproxy.cfg.j2 before lowering it. Steady state
# on this pair is ~30 connections, so this is deliberate headroom, not a tuning target.
pg_ha_haproxy_maxconn: 4000

# --- PgBouncer (transaction mode for the WEB tier; ADR 0008 / #8) ---
# The edoburu/pgbouncer image runs as uid 70 (its 'postgres') and drops to it even if started as
# root, so userlist.txt must be owned by this uid to stay 0600 yet readable by the container.
pgbouncer_uid: "70"
pgbouncer_listen_port: 6432
pgbouncer_pool_mode: "transaction"
pgbouncer_max_client_conn: 1000
pgbouncer_default_pool_size: 20
# psycopg3 (the app) uses server-side prepared statements; PgBouncer >=1.21 supports them in
# transaction mode when this is > 0 (it tracks + renames them per server connection).
pgbouncer_max_prepared_statements: 200
# Fast failover (leader switchover): retry a dropped backend after 1s, not the 15s default.
pgbouncer_server_login_retry: 1
pgbouncer_server_connect_timeout: 5

# --- Backups: nightly pg_dump -> Backblaze B2 via rclone (ADR 0016) ---
pg_ha_backup_enabled: true
pg_ha_backup_host: "vent.dog"             # run the dump on ONE node only (avoid double dumps)
# 02:00 box time. NOT 4 — that was the original default and it collides head-on with roles/drain's
# drain_reboot_time of "04:00". Measured 2026-07-29: the backup cron fired at 04:00:00 and
# keygrip-safe-reboot.timer at 04:00:58, i.e. the dump won by ~40s and nothing said otherwise. The
# reboot path hands off the Patroni leader and then kills this script, and `rclone rcat` turns the
# truncated stream into an object that clears pg_ha_backup_min_bytes and reads as a good backup.
# Changing this back re-arms that race; the flock in backup.sh is the second line of defence.
pg_ha_backup_hour: 2
pg_ha_b2_bucket: "Backup-jaigner-homelab"
pg_ha_b2_path: "keygrip-pgha"             # bucket sub-path for these dumps
pg_ha_backup_retain_days: 14
# EVERY database on the cluster, not just the app's — this cluster is shared by clip, vent chat and
# Keycloak. Until 2026-07-29 this script dumped a single database, and (because app_db_name had been
# renamed under it) the one it dumped was `keygrip`: a leftover with 0 backends and 0 commits. So the
# live app data, all of Dendrite's chat history, and keycloak.user_entity — the ONLY copy of every
# login on id.clip.cool — had never been backed up at all, while three nightly dumps of a dead
# database sat in B2 looking like a working backup.
#   - The stale pre-rename `keygrip` database was DROPPED on 2026-07-30 (25 tables, 40 MB, 0
#     backends, byte-identical dumps three nights running). A final archival dump was taken first
#     and verified by streaming it back out of B2 and matching table counts:
#       b2:Backup-jaigner-homelab/keygrip-pgha-archive/keygrip-final-20260730T021403Z.sql.gz
#     That prefix is deliberately OUTSIDE pg_ha_b2_path — the retention prune below hard-deletes
#     anything older than the window under that path, which would eventually eat the archive.
#   - `postgres` is excluded: system database, no app data.
# B2's storage cap is ACCOUNT-wide (the sibling tier was refused uploads with storage_cap_exceeded on
# 2026-07-26 while its own bucket held 216 MiB), so this list is a spend decision, not just a safety
# one — hence keeping it explicit rather than enumerating pg_database at runtime.
pg_ha_backup_databases:
  - "{{ app_db_name }}"                   # clip — the live app database
  - "{{ vent_db_name }}"                  # vent chat app
  - "{{ dendrite_db_name }}"              # Matrix homeserver: all chat history
  - keycloak                              # every identity on id.clip.cool
# Cheap first gate only: catches a zero-byte or near-empty object without downloading anything.
# It deliberately does NOT try to catch truncation — a byte floor cannot, because a small dump and a
# truncated dump look identical. `vent` is an empty placeholder database whose COMPLETE dump is
# ~3 KB, so the 20000 this was ported with rejected it every night (measured 2026-07-30: "landed
# 3025 bytes, under the 20000-byte floor", which then skipped the retention prune for the whole run).
# Truncation is caught properly in backup.sh by requiring pg_dump's completion marker in the object
# streamed back out of B2 — a check that works at any size and also proves the upload is readable.
pg_ha_backup_min_bytes: 500
# Advisory lock the dump holds for its whole run. roles/drain's guarded auto-reboot tests this same
# path and skips its window while a dump is in flight (drain_backup_lock). On tmpfs (/run), so it
# cannot survive a reboot and strand the lock. Moving this path means moving drain_backup_lock too.
pg_ha_backup_lock: /run/lock/keygrip-pgha-backup.lock
# Where backup.sh publishes its age metrics for node-exporter's textfile collector. Follows the
# observability role (same box: pg_ha_backup_host is vent.dog, which is `primary`), with a literal
# fallback for a tier that runs this role without that one.
# NOT under /run: these must survive a reboot, or a reboot reads as a vanished backup.
pg_ha_backup_metrics_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"
