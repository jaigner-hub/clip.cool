---
# Self-hosted HA Postgres (ADR 0016). Brings up the per-node stack: etcd + Patroni/Postgres +
# HAProxy + PgBouncer. Patroni coordinates the bootstrap via etcd — whichever node grabs the DCS
# leader key first runs initdb; the other clones it as a replica. The two data-node etcd members
# form a 2/3 majority on their own, so first bootstrap does NOT require the witness to be up.
#
# LIVE (ADR 0016): bootstrapped + failover-verified on the vent.dog pair 2026-06-11. See the README.

- name: Resolve this host's Patroni/etcd identity
  ansible.builtin.set_fact:
    patroni_name: "{{ pg_ha_host_identity[inventory_hostname].name }}"
    node_address: "{{ pg_ha_host_identity[inventory_hostname].address }}"

- name: Fail early if this host has no identity mapping
  ansible.builtin.assert:
    that: inventory_hostname in pg_ha_host_identity
    fail_msg: "No pg_ha_host_identity entry for {{ inventory_hostname }} — add its tailnet name."

- name: Ensure the stack dir exists
  ansible.builtin.file:
    path: "{{ pg_ha_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stage the Patroni image build context (Dockerfile + entrypoint)
  ansible.builtin.template:
    src: Dockerfile.patroni.j2
    dest: "{{ pg_ha_dir }}/Dockerfile.patroni"
    mode: "0644"
  register: _patroni_dockerfile

- name: Stage the Patroni entrypoint
  ansible.builtin.copy:
    src: patroni-entrypoint.sh
    dest: "{{ pg_ha_dir }}/patroni-entrypoint.sh"
    mode: "0755"
  register: _patroni_entrypoint

- name: Render non-secret configs (patroni / compose)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ pg_ha_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - patroni.yml
    - compose.yml

- name: Render haproxy.cfg (restart haproxy on change — it's a read-only mount)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ pg_ha_dir }}/haproxy.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: restart haproxy

- name: Render pgbouncer.ini (restart pgbouncer on change)
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: "{{ pg_ha_dir }}/pgbouncer.ini"
    owner: root
    group: root
    mode: "0644"
  notify: restart pgbouncer

- name: Render .env (secrets) — root:root 0600
  ansible.builtin.template:
    src: env.j2                                # compose env_file expects .env (dotfile)
    dest: "{{ pg_ha_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render pgbouncer userlist — owned by the pgbouncer container uid so 0600 stays readable
  ansible.builtin.template:
    src: userlist.txt.j2
    dest: "{{ pg_ha_dir }}/userlist.txt"
    owner: "{{ pgbouncer_uid }}"
    group: "{{ pgbouncer_uid }}"
    mode: "0600"
  no_log: true
  notify: restart pgbouncer

- name: Build + bring up the HA Postgres stack
  community.docker.docker_compose_v2:
    project_src: "{{ pg_ha_dir }}"
    # Rebuild ONLY when the image's build context actually changed. This was `always`, which rebuilt
    # the Patroni image on every run — and because Dockerfile.patroni tracks the floating
    # `postgres:{{ pg_ha_postgres_major }}-bookworm` tag, a new image id recreates the container, so
    # a no-op config run restarted Postgres and could move the leader. Observed 2026-07-29: shipping
    # nothing but two etcd env lines recreated the patroni container on both boxes. That made real
    # changes indistinguishable from noise, which is how a role stops being trusted. The two tasks
    # above are the only way the build context can change, so gating on them keeps a genuine
    # Dockerfile/entrypoint edit rebuilding.
    build: "{{ 'always' if (_patroni_dockerfile.changed or _patroni_entrypoint.changed) else 'policy' }}"
    state: present

# The app containers (webapp/worker, on docker bridges) reach the host proxies via host-gateway.
# ufw default-denies incoming, so allow the docker private range to the proxy ports. The PUBLIC
# interface stays blocked (this src range is non-routable from the internet).
- name: Allow docker containers to reach the DB proxies (pgbouncer + haproxy)
  community.general.ufw:
    rule: allow
    src: "172.16.0.0/12"
    port: "{{ item }}"
    proto: tcp
    comment: "keygrip app -> DB proxy (ADR 0016)"
  loop:
    - "{{ pgbouncer_listen_port }}"
    - "{{ pg_ha_haproxy_write_port }}"
    - "{{ pg_ha_haproxy_read_port }}"
    # Prometheus (a container on vent.dog) scrapes HAProxy's stats/metrics port here. Cross-box
    # scraping of the other node rides tailscale0, which is already allowed.
    - "{{ pg_ha_haproxy_stats_port }}"

# --- App database + role (created once, on the leader, via HAProxy's write port) ---
# HAProxy routes 127.0.0.1:{{ write }} to the current leader; the app role/db creation is idempotent.
# run_once so it happens from a single host regardless of which node won the leader election.
- name: Wait for the leader to accept writes (HAProxy /primary backend up)
  ansible.builtin.command: >-
    docker compose -f {{ pg_ha_dir }}/compose.yml exec -T patroni
    pg_isready -h 127.0.0.1 -p {{ pg_ha_haproxy_write_port }}
  register: _pg_ready
  retries: 30
  delay: 5
  until: _pg_ready.rc == 0
  changed_when: false
  run_once: true

- name: Render the idempotent app-db init SQL (0600)
  ansible.builtin.template:
    src: init-app-db.sql.j2
    dest: "{{ pg_ha_dir }}/init-app-db.sql"
    owner: root
    group: root
    mode: "0600"
  run_once: true
  no_log: true

- name: Create the app role + database (idempotent; on the leader via HAProxy)
  ansible.builtin.shell:
    cmd: >-
      docker compose -f {{ pg_ha_dir }}/compose.yml exec -T
      -e PGPASSWORD={{ vault_pg_superuser_password }} patroni
      psql -h 127.0.0.1 -p {{ pg_ha_haproxy_write_port }} -U postgres -v ON_ERROR_STOP=1 -f -
      < {{ pg_ha_dir }}/init-app-db.sql
  register: _init_app_db
  run_once: true
  no_log: true
  # The SQL is idempotent (`\gexec` runs the DDL only when the object is missing), so reporting an
  # unconditional `changed` was a lie every run after the first — and a role that always says
  # `changed` trains you to ignore the one run where it means something. psql prints a CREATE ROLE /
  # CREATE DATABASE command tag ONLY when \gexec actually executed, so the tag is the honest signal.
  changed_when: >-
    'CREATE ROLE' in _init_app_db.stdout or 'CREATE DATABASE' in _init_app_db.stdout

# --- Nightly pg_dump -> Backblaze B2 (ADR 0016). Runs on ONE node only; rclone config via env. ---
# All four tasks carry the `backup` tag so the script can be shipped on its own:
#   ./ac ansible-playbook playbooks/postgres-ha.yml --limit vent.dog --tags backup
# That matters because this playbook has NO `serial:` — a bare run recreates etcd on BOTH data nodes
# inside the same task (see the playbook header), which is not something you want to do just to
# change a shell script. The tag keeps a backup-only change off the cluster path entirely.
#
# The textfile-collector drop dir backup.sh publishes its age metrics into. Created here as well as
# in roles/observability because THIS role is the writer: postgres-ha.yml must not depend on
# observability.yml having run first (it currently has, but that ordering is nowhere enforced).
- name: Ensure the backup metrics dir (backup host only)
  ansible.builtin.file:
    path: "{{ pg_ha_backup_metrics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - pg_ha_backup_enabled | bool
    - inventory_hostname == pg_ha_backup_host
  tags: [backup]

- name: Install rclone (backup host only)
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
  when:
    - pg_ha_backup_enabled | bool
    - inventory_hostname == pg_ha_backup_host
  tags: [backup]

- name: Install the backup script (backup host only)
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ pg_ha_dir }}/backup.sh"
    owner: root
    group: root
    mode: "0700"
  when:
    - pg_ha_backup_enabled | bool
    - inventory_hostname == pg_ha_backup_host
  no_log: true
  tags: [backup]

- name: Schedule the nightly backup (backup host only)
  ansible.builtin.cron:
    name: "keygrip-pgha pg_dump -> B2"
    hour: "{{ pg_ha_backup_hour }}"
    minute: "0"
    job: "{{ pg_ha_dir }}/backup.sh >> /var/log/keygrip-pgha-backup.log 2>&1"
  when:
    - pg_ha_backup_enabled | bool
    - inventory_hostname == pg_ha_backup_host
  tags: [backup]
